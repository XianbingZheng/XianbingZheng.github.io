<!DOCTYPE html>
<html>
<head>
    <title>财神赐福</title>
    <style>
        body {
            text-align: center;
            background-color: #fef4e1;
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        /* 按钮容器 - 初始显示 */
        #buttonContainer {
            margin-top: 60px;
        }
        #startButton {
            padding: 20px 40px;
            font-size: 24px;
            background: linear-gradient(to right, #e60012, #ff7e00);
            color: gold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            font-weight: bold;
        }
        /* 动画容器 - 初始隐藏 */
        #animationContainer {
            display: none;
            margin: 20px auto;
        }
        #animation {
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }
        /* 备用手动播放按钮 - 初始隐藏 */
        #manualPlayBtn {
            display: none;
            margin: 15px auto;
            padding: 12px 25px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        /* 签文容器 - 初始隐藏 */
        #resultContainer {
            display: none;
            margin-top: 30px;
        }
        #blessingImage {
            width: 90%;
            max-width: 600px;
            border-radius: 15px;
            border: 8px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- 第一部分：开始按钮 -->
    <div id="buttonContainer">
        <button id="startButton" onclick="startAnimation()">🎉 点我求签 🎉</button>
    </div>

    <!-- 第二部分：动画容器 -->
    <div id="animationContainer">
        <video id="animation" muted playsinline style="width:100%;">
            <!-- 【重要】请替换src为你的视频实际地址 -->
            <source src="cq.mp4" type="video/mp4">
            您的浏览器不支持视频标签。
        </video>
        <!-- 备用：手动播放按钮 -->
        <button id="manualPlayBtn" onclick="playVideoManually()">▶️ 点此播放动画</button>
    </div>

    <!-- 第三部分：签文结果 -->
    <div id="resultContainer">
        <img id="blessingImage" src="" alt="福签">
    </div>

    <script>
           // 1. 签文图片列表 (图片位于images文件夹内)
           const blessings = [
                    "images/ssq11.jpg",   // 请确保文件名和扩展名完全匹配
                    "images/ssq22.jpg",
                    "images/ssq33.jpg",
                    "images/zs11.jpg",
                    "images/zs22.jpg",
                    "images/zs33.jpg",
                    "images/sq11.jpg",
                    "images/sq22.jpg",
                    "images/sq33.jpg"
                    // 如需添加更多，格式为: "images/你的文件名.jpg"
           ];

        // 2. 核心函数：开始流程
        function startAnimation() {
            // 隐藏开始按钮
            document.getElementById('buttonContainer').style.display = 'none';
            // 显示动画容器
            document.getElementById('animationContainer').style.display = 'block';

            // 获取视频元素
            const video = document.getElementById('animation');
            const manualBtn = document.getElementById('manualPlayBtn');

            // 首先尝试自动播放
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        // 自动播放成功：隐藏手动按钮，监听结束
                        manualBtn.style.display = 'none';
                        video.addEventListener('ended', onAnimationEnd);
                    })
                    .catch(() => {
                        // 自动播放失败：显示手动按钮
                        manualBtn.style.display = 'block';
                        console.log("自动播放被阻止，等待用户手动触发。");
                    });
            }
        }

        // 3. 备用函数：用户手动播放视频
        function playVideoManually() {
            const video = document.getElementById('animation');
            const manualBtn = document.getElementById('manualPlayBtn');

            video.play()
                .then(() => {
                    // 手动播放成功：隐藏手动按钮，监听结束
                    manualBtn.style.display = 'none';
                    video.addEventListener('ended', onAnimationEnd);
                })
                .catch(e => {
                    // 连手动播放都失败，给出最友好提示
                    alert("抱歉，视频无法播放。请直接查看您的福签！");
                    // 直接跳转到显示签文
                    onAnimationEnd();
                });
        }

        // 4. 动画结束后的统一回调函数
        function onAnimationEnd() {
            // 隐藏动画容器
            document.getElementById('animationContainer').style.display = 'none';
            // 显示随机签文
            showRandomBlessing();
        }

        // 5. 随机显示签文
        function showRandomBlessing() {
            const randomIndex = Math.floor(Math.random() * blessings.length);
            document.getElementById('blessingImage').src = blessings[randomIndex];
            document.getElementById('resultContainer').style.display = 'block';
        }
    </script>
</body>
</html>
